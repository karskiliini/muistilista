name: Ostoslista
options:
  bundleIdPrefix: fi.maaranen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Ostoslista:
    type: application
    platform: iOS
    sources: [Ostoslista]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslista
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
  OstoslistaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OstoslistaTests]
    dependencies:
      - target: Ostoslista
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslistaTests
schemes:
  Ostoslista:
    build:
      targets:
        Ostoslista: all
    test:
      targets: [OstoslistaTests]
