name: Ostoslista
options:
  bundleIdPrefix: fi.maaranen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Ostoslista:
    type: application
    platform: iOS
    sources: [Ostoslista]
    dependencies:
      - target: OstoslistaWidget
    entitlements:
      path: Ostoslista/Ostoslista.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fi.maaranen.ostoslista
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslista
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37SJ6TU5RP
  OstoslistaWidget:
    type: app-extension
    platform: iOS
    sources:
      - OstoslistaWidget
      - Ostoslista/ShoppingItem.swift
      - Ostoslista/SharedStore.swift
    entitlements:
      path: OstoslistaWidget/OstoslistaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fi.maaranen.ostoslista
    info:
      path: OstoslistaWidget/Info.plist
      properties:
        CFBundleDisplayName: Ostoslista
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslista.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37SJ6TU5RP
        SKIP_INSTALL: YES
  OstoslistaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OstoslistaTests]
    dependencies:
      - target: Ostoslista
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslistaTests
schemes:
  Ostoslista:
    build:
      targets:
        Ostoslista: all
    test:
      targets: [OstoslistaTests]
