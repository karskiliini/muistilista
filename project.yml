name: Ostoslista
options:
  bundleIdPrefix: fi.maaranen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Ostoslista:
    type: application
    platform: iOS
    sources: [Ostoslista]
    dependencies:
      - target: OstoslistaWidget
        platformFilter: iOS
    entitlements:
      path: Ostoslista/Ostoslista.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fi.maaranen.ostoslista
        com.apple.developer.icloud-container-identifiers:
          - iCloud.fi.maaranen.ostoslista
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: Ostoslista/Info.plist
      properties:
        CFBundleDisplayName: Ostoslista
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CKSharingSupported: true
        NSLocationWhenInUseUsageDescription: "Sijaintia käytetään lähimmän K-ruokakaupan valintaan tuotehakuun."
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        MARKETING_VERSION: 1.28.0
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslista
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37SJ6TU5RP
  OstoslistaWidget:
    type: app-extension
    platform: iOS
    sources:
      - OstoslistaWidget
      - Ostoslista/CDShoppingItem.swift
      - Ostoslista/CDShoppingList.swift
      - Ostoslista/CDShelfMemory.swift
      - Ostoslista/CoreDataStack.swift
      - Ostoslista/CrashReporter.swift
      - Ostoslista/ShoppingListLogic.swift
    entitlements:
      path: OstoslistaWidget/OstoslistaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.fi.maaranen.ostoslista
    info:
      path: OstoslistaWidget/Info.plist
      properties:
        CFBundleDisplayName: Ostoslista
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslista.widget
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 37SJ6TU5RP
        SKIP_INSTALL: YES
  OstoslistaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [OstoslistaTests]
    dependencies:
      - target: Ostoslista
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslistaTests
  OstoslistaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OstoslistaUITests]
    dependencies:
      - target: Ostoslista
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: fi.maaranen.ostoslistaUITests
        TEST_TARGET_NAME: Ostoslista
schemes:
  Ostoslista:
    build:
      targets:
        Ostoslista: all
    test:
      targets: [OstoslistaTests, OstoslistaUITests]
